<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lab two exercise One</title>
</head>
<body>
  <h1>switch statement</h1>
  <p>look in the console for output</p>
  <script>
   let colour ="red";
    switch (colour) {
      case "red":
        console.log("Stop");
        break;
        case "yellow":
        console.log("Slow down");
        break;
      case "green":
        console.log("Go");
        break;
      default:
        console.log("Unknown colour");
    }
  </script>
</body>
</html>
